*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance}
.app{max-width:440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.app.has-bar{padding-bottom:120px}

/* focus ring (shadcn: ring-[3px] ring-ring/50) */

.logo small{font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.me-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-md);padding:0 12px 0 6px;height:36px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;box-shadow:var(--shadow-xs)}
.me-chip:only-child,.me-chip:not(:has(.av)){padding-left:12px}
.me-chip b{color:var(--ink);font-weight:500}

/* avatar (shadcn Avatar) */
.av{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--muted-bg);font-size:19px;line-height:1;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:contain;padding:10%}
.av.sm{width:26px;height:26px;font-size:14px}
.av.lg{width:56px;height:56px;font-size:30px}
.av.off{opacity:.4;filter:grayscale(1)}
.av.off:has(img){filter:none;opacity:1}
.av.off img{filter:var(--sil-filter);opacity:var(--sil-op)}

/* card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xl);padding:20px;box-shadow:var(--shadow-sm)}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--muted)}
/* badge */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:var(--radius-sm);border:1px solid var(--line);padding:2px 8px;font-size:12px;font-weight:500;line-height:1.4;background:var(--surface);color:var(--ink)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--success)}
.pill.st-confirmed{background:var(--success);color:var(--accent-ink);border-color:transparent}
.pill.st-confirmed::before{background:currentColor}
.pill.st-over{background:var(--primary);color:var(--primary-fg);border-color:transparent}
.pill.st-over::before{content:"✓";width:auto;height:auto;border-radius:0;background:none;font-size:11px;line-height:1}
.pill.st-ended{background:var(--muted-bg);color:var(--muted);border-color:transparent}
.pill.st-ended::before{background:var(--muted)}
.h2{font-family:var(--f-display);font-weight:600;letter-spacing:-.02em;font-size:26px;line-height:1.2;margin:10px 0 4px}
.range{color:var(--muted);font-size:12px;margin:0;font-variant-numeric:tabular-nums}

/* members stage */
.members{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:18px 0 16px;padding:20px 10px 16px;border-radius:var(--radius);background:var(--stage)}
.mem{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;text-align:center;min-width:0}
.fig{position:relative;width:100%;aspect-ratio:1/1;display:flex;align-items:flex-end;justify-content:center;margin-bottom:6px}
.fig::after{content:"";position:absolute;left:8%;right:8%;bottom:0;height:22%;border-radius:50%;background:linear-gradient(var(--ped-top),var(--ped-top)) top/100% 70% no-repeat,var(--ped-side);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.char{position:relative;z-index:1;display:block;width:calc(84% * var(--s, 1));margin-bottom:9%}
.char img{display:block;width:100%;height:auto;transition:filter .35s,opacity .35s,transform .35s}
.hat-wrap{position:absolute;left:var(--hx);top:var(--hy);width:36%;z-index:2;transform:translate(-50%,-88%) rotate(-14deg);transform-origin:50% 100%;pointer-events:none}
.hat-wrap.near{opacity:.5}
.hat{display:block;width:100%;height:auto;filter:drop-shadow(0 1px 1px rgba(0,0,0,.15))}
.fig.bday .char{animation:none}
.mem:not(.pending) .fig.bday .hat-wrap{animation:tilt 2.4s ease-in-out .6s infinite}
@keyframes tilt{0%,100%{transform:translate(-50%,-88%) rotate(-14deg)}50%{transform:translate(-50%,-90%) rotate(-6deg)}}
.fig .emo{position:relative;z-index:1;font-size:30px;line-height:1;margin-bottom:14%}
.fig.sil .char img,.fig.sil .emo{filter:var(--sil-filter);opacity:var(--sil-op)}
.mem:not(.pending) .fig .char{animation:hop .5s ease-out both}

/* 오늘이 속한 달부터 24개월을 고를 수 있어요. 값은 그 달 1일 */
function monthOpts(sel) {
  const t = new Date(), now = new Date(t.getFullYear(), t.getMonth(), 1), want = toKey(sel);
  const base = sel < now ? new Date(sel.getFullYear(), sel.getMonth(), 1) : now;
  let html = '', found = false;
  for (let i = 0; i < 24; i++) {
    const d = new Date(base.getFullYear(), base.getMonth() + i, 1), k = toKey(d);
    if (k === want) found = true;
    html += `<option value="${k}" ${k === want ? 'selected' : ''}>${d.getFullYear()}년 ${d.getMonth() + 1}월</option>`;
  }
  return found ? html : `<option value="${want}" selected>${sel.getFullYear()}년 ${sel.getMonth() + 1}월</option>` + html;
}
function newInfo() {
  const sm = document.getElementById('nm-start').value, em = document.getElementById('nm-end').value;
  if (!sm || !em) return { err: '후보 기간을 모두 골라주세요.' };
  if (em < sm) return { err: '마지막 달이 시작 달보다 빨라요.' };
  const ed = parse(em), s = sm, e = toKey(new Date(ed.getFullYear(), ed.getMonth() + 1, 0));
  const months = (ed.getFullYear() - parse(sm).getFullYear()) * 12 + ed.getMonth() - parse(sm).getMonth() + 1;
  if (months > 4) return { err: '후보 기간은 4개월 안으로 정해주세요.' };
  const n = days(s, e).length;
  const year = parse(s).getFullYear(), mt = editMid ? byId(editMid) : null;
  const round = mt && mt.year === year ? mt.round : S.meetings.filter(x => x.year === year && x !== mt).length + 1;
  let drop = 0, unconfirm = false;
  if (mt) {
    drop = Object.values(mt.avail || {}).flat().filter(d => d < s || d > e).length;
    unconfirm = !!mt.confirmed && (mt.confirmed < s || mt.confirmed > e);
  }
  return { s, e, n, year, round, drop, unconfirm };
}
function updPrev() {
  const i = newInfo(), p = document.getElementById('nm-prev'), er = document.getElementById('nm-err');
  const w = document.getElementById('nm-warn');
  if (i.err) { er.textContent = i.err; er.hidden = false; w.hidden = true; p.innerHTML = '<span>회차</span><b>-</b>'; return; }
  er.hidden = true;
  const notes = [];
  if (i.unconfirm) notes.push(`확정된 날(${fmt(byId(editMid).confirmed)})이 새 기간 밖이라 확정이 취소돼요.`);
  if (i.drop) notes.push(`새 기간 밖에 찍힌 날짜 ${i.drop}개는 지워져요.`);
  w.innerHTML = notes.join('<br>'); w.hidden = !notes.length;
  p.innerHTML = `<span>${md(i.s)} ~ ${md(i.e)}</span><b>${i.year}년 ${i.round}회차 · ${i.n}일</b>`;
}

/* ---------- render ---------- */
function render(scrollTop) {
  $app.classList.toggle('has-bar', view === 'input');
  if (MODE === 'loading' || MODE === 'error') {
    $app.innerHTML = `${brand()}<div class="empty" style="margin-top:12px">${MODE === 'loading' ? '식구들 일정을 불러오는 중이에요…' : `${esc(bootError || '데이터를 불러오지 못했어요.')}<div class="btns"><button class="btn plain" data-act="retry">다시 불러오기</button></div>`}</div>`;
    return;
  }
  $app.innerHTML = view === 'home' ? vHome() : view === 'input' ? vInput() : view === 'result' ? vResult() : vNew();
  if (view === 'input') updCount();
  if (view === 'new') {
    updPrev();
    const $s = document.getElementById('nm-start'), $e = document.getElementById('nm-end');
    $s.addEventListener('change', () => { if ($e.value < $s.value) $e.value = $s.value; updPrev(); });
    $e.addEventListener('change', updPrev);
    document.getElementById('nf').addEventListener('submit', e => { e.preventDefault(); editMid ? updateMeeting() : createMeeting(); });
  }
  if (scrollTop) window.scrollTo(0, 0);
}
const go = v => { view = v; render(true); };

function toast(t) { $toast.textContent = t; $toast.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => $toast.classList.remove('show'), 1900); }
let sheetTimer = null;
function openSheet(html) { clearTimeout(sheetTimer); $sheet.innerHTML = '<div class="grab"></div>' + html; $scrim.hidden = false; requestAnimationFrame(() => $scrim.classList.add('open')); }
function closeSheet() { $scrim.classList.remove('open'); clearTimeout(sheetTimer); sheetTimer = setTimeout(() => { $scrim.hidden = true; }, 200); }
$scrim.addEventListener('click', e => { if (e.target === $scrim) closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$scrim.hidden) closeSheet(); });

function sheetPlan(id) {

  openSheet(`<h2>시간·장소</h2><p class="sub">${fmtY(m.confirmed)} · 식구 모두가 보고 바꿀 수 있어요.</p>
    <form id="pf" novalidate>

    </form>
    ${log.length ? `<div class="grp"><div class="grp-t">바뀐 기록</div><ul class="log">${log.map(l => `<li>${av(l.by, 'sm')}<span class="lx">${M[l.by].name} · ${esc(l.text)}</span><span class="lt">${stamp(l.at)}</span></li>`).join('')}</ul></div>` : ''}`);
  document.getElementById('pf').addEventListener('submit', e => { e.preventDefault(); savePlan(id); });

function savePlan(id) {
  const m = byId(id), time = document.getElementById('pl-time').value, place = document.getElementById('pl-place').value.trim();
  if (time === (m.time || '') && place === (m.place || '')) { closeSheet(); return; }
  const parts = [];
  if (time !== (m.time || '')) parts.push(time ? `시간 ${fmtTime(time)}` : '시간 지움');
  if (place !== (m.place || '')) parts.push(place ? `장소 ${place}` : '장소 지움');
  const text = parts.join(' · ');
  commit({ type: 'plan', mid: m.id, by: S.me, time, place, text }, () => {
    const n = new Date();
    (m.log || (m.log = [])).push({ by: S.me, at: `${toKey(n)}T${pad(n.getHours())}:${pad(n.getMinutes())}`, text });
    m.time = time; m.place = place;
  }).then(ok => { if (ok) { closeSheet(); render(); toast('시간·장소를 저장했어요'); } });
}
function openPlan(id) { if (!S.me) { pendingAfterPick = 'plan:' + id; sheetWho(); } else sheetPlan(id); }

const CAM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';

const ro2 = w => ga(w);
let photoFor = null;
const $photoIn = document.getElementById('photo-in');
function pickPhoto(id) { if (!S.me) { pendingAfterPick = 'photo:' + id; sheetWho(); return; } photoFor = id; $photoIn.value = ''; $photoIn.click(); }
$photoIn.addEventListener('change', async () => {
  const f = $photoIn.files && $photoIn.files[0], m = byId(photoFor); if (!f || !m) return;
  try {
    const url = URL.createObjectURL(f), img = new Image();
    await new Promise((ok, no) => { img.onload = ok; img.onerror = no; img.src = url; });
    const max = 1200, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
    const data = c.toDataURL('image/jpeg', 0.8);
    if (MODE === 'server') {
      toast('사진을 올리는 중이에요…');
      if (await commit({ type: 'photo', mid: m.id, by: S.me, data })) { render(); toast('모임 사진을 올렸어요'); }
      return;
    }
    const prev = [m.photo, m.photoBy];
    m.photo = data; m.photoBy = S.me;
    if (!save()) { [m.photo, m.photoBy] = prev; toast('저장 공간이 부족해요. 다른 사진을 지운 뒤 다시 올려주세요.'); return; }
    render(); toast('모임 사진을 올렸어요');
  } catch (e) { toast('사진을 열 수 없어요. 다른 사진으로 해볼래요?'); }
});
function sheetPhotoDel(id) {
  openSheet(`<h2>모임 사진을 지울까요?</h2><p class="sub">지우면 지난 모임 목록에서도 사라져요.</p>
    <div class="row-btns"><button class="btn plain" data-act="close">취소</button><button class="btn pri" data-act="dophotodel" data-v="${id}">지우기</button></div>`);
}
function sheetReset() {
  openSheet(`<h2>예시 데이터로 되돌릴까요?</h2><p class="sub">이 폰에서 바꾼 내용이 모두 지워져요. 프로토타입이라 다른 사람에겐 영향이 없어요.</p>
    <div class="row-btns"><button class="btn plain" data-act="close">취소</button><button class="btn pri" data-act="doreset">되돌리기</button></div>`);
}

/* ---------- actions ---------- */
function startInput() { const m = cur(); draft = new Set(m.avail[S.me] || []); go('input'); }
function dirty() { const a = cur().avail[S.me] || []; return a.length !== draft.size || a.some(d => !draft.has(d)); }
function updCount() { const c = document.getElementById('count'); if (c) c.innerHTML = `<b>${draft.size}</b>일 선택`; }
function paintEl(k) { const el = $app.querySelector(`.day[data-d="${k}"]`); if (el) { el.classList.toggle('sel', draft.has(k)); el.setAttribute('aria-pressed', draft.has(k)); } }
async function updateMeeting() {
  const i = newInfo(); if (i.err) { updPrev(); return; }
  const id = editMid, typed = document.getElementById('nm-title').value.trim();
  const ok = await commit({ type: 'update', mid: id, title: typed, start: i.s, end: i.e }, () => {
    const m = byId(id), out = !!m.confirmed && (m.confirmed < i.s || m.confirmed > i.e);
    Object.assign(m, { title: typed || m.title, start: i.s, end: i.e, year: i.year, round: i.round });
    for (const k of Object.keys(m.avail || {})) m.avail[k] = m.avail[k].filter(d => d >= i.s && d <= i.e);
    if (out) { m.confirmed = null; m.status = 'voting'; S.meetings.forEach(x => { if (x !== m && x.status === 'voting') x.status = 'archived'; }); }
  });
  if (!ok) return;
  editMid = null; viewMid = id; go('result'); toast('모임을 수정했어요');
}
function sheetDel(id) {
  const m = byId(id);
  openSheet(`<h2>${esc(eul(m.title))} 삭제할까요?</h2><p class="sub">${label(m)} 모임과 식구들이 찍은 날짜, 시간·장소, 사진이 모두 지워져요. 지운 뒤에는 되돌릴 수 없어요.</p>
    <div class="row-btns"><button class="btn plain" data-act="close">취소</button><button class="btn del-solid" data-act="dodel" data-v="${id}">삭제하기</button></div>`);
}
async function createMeeting() {
  const i = newInfo(); if (i.err) { updPrev(); return; }
  const typed = document.getElementById('nm-title').value.trim();
  const ok = await commit({ type: 'create', title: typed, start: i.s, end: i.e }, () => {
    const c = cur(); if (c && c.status === 'voting') c.status = 'archived';
    S.meetings.unshift({ id: 'm' + Date.now(), year: i.year, round: i.round, title: typed || `${i.round}회차 모임`, start: i.s, end: i.e, confirmed: null, status: 'voting', avail: {} });
  });
  if (!ok) return;
  const m = cur();
  go('home'); toast(`${m.year}년 ${m.round}회차 ${eul(m.title)} 만들었어요`);
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) {
    const c = e.target.closest('.day[data-d]');
    if (view === 'input' && c && !c.disabled && e.detail === 0) { draft.has(c.dataset.d) ? draft.delete(c.dataset.d) : draft.add(c.dataset.d); paintEl(c.dataset.d); updCount(); }
    return;
  }
  const v = t.dataset.v;
  switch (t.dataset.act) {
    case 'home': go('home'); break;
    case 'leave': if (dirty()) sheetLeave(); else go('home'); break;
    case 'drop': closeSheet(); go('home'); break;
    case 'who': pendingAfterPick = null; sheetWho(); break;
    case 'enter': if (!S.me) { pendingAfterPick = 'input'; sheetWho(); } else startInput(); break;
    case 'pickme':
      S.me = v; save(); closeSheet(); toast(`${ro(M[v].name)} 들어왔어요`);
      if (pendingAfterPick === 'input') { pendingAfterPick = null; startInput(); }
      else if (pendingAfterPick && pendingAfterPick.startsWith('photo:')) { const id = pendingAfterPick.slice(6); pendingAfterPick = null; render(); pickPhoto(id); }
      else if (pendingAfterPick && pendingAfterPick.startsWith('plan:')) { const id = pendingAfterPick.slice(5); pendingAfterPick = null; render(); sheetPlan(id); }
      else render(); break;
    case 'plan': openPlan(v); break;
    case 'settime': document.getElementById('pl-time').value = v; break;
    case 'result': viewMid = v || cur().id; go('result'); break;
    case 'new': editMid = null; go('new'); break;
    case 'edit': editMid = v; go('new'); break;
    case 'askdel': sheetDel(v); break;
    case 'dodel': {
      const title = (byId(v) || {}).title || '모임';
      commit({ type: 'delete', mid: v }, () => { S.meetings = S.meetings.filter(x => x.id !== v); })
        .then(ok => { if (ok) { closeSheet(); editMid = null; viewMid = null; go('home'); toast(`${eul(title)} 삭제했어요`); } });
      break;
    }
    case 'weekend': { const m = cur(); days(m.start, m.end).filter(isOff).forEach(d => { draft.add(d); paintEl(d); }); updCount(); toast('주말과 공휴일을 모두 골랐어요'); break; }
    case 'clear': { const old = [...draft]; draft.clear(); old.forEach(paintEl); updCount(); break; }
    case 'save': {
      const m = cur(), dates = [...draft].sort();
      commit({ type: 'avail', mid: m.id, member: S.me, dates }, () => { m.avail[S.me] = dates; })
        .then(ok => { if (ok) { closeSheet(); viewMid = m.id; go('result'); toast(`${dates.length}일 저장했어요`); } });
      break;
    }
    case 'retry': MODE = 'loading'; render(); boot(); break;
    case 'day': sheetDay(v); break;
    case 'askconf': sheetConfirm(v); break;
    case 'conf': {
      const id = (byId(viewMid) || cur()).id;
      commit({ type: 'confirm', mid: id, date: v }, () => { const m = byId(id); m.confirmed = v; m.status = 'confirmed'; })
        .then(ok => { if (ok) { render(); toast(`${fmt(v)}로 확정했어요`); openPlan(id); } });
      break;
    }
    case 'unconf': {
      const id = (byId(viewMid) || cur()).id;
      commit({ type: 'unconfirm', mid: id }, () => { const m = byId(id); m.confirmed = null; m.status = 'voting'; S.meetings.forEach(x => { if (x !== m && x.status === 'voting') x.status = 'archived'; }); })
        .then(ok => { if (ok) { closeSheet(); render(); toast('확정을 취소했어요'); } });
      break;
    }
    case 'close': closeSheet(); break;
    case 'photo': pickPhoto(v); break;
    case 'photodel': sheetPhotoDel(v); break;
    case 'dophotodel':
      commit({ type: 'photodel', mid: v }, () => { const m = byId(v); m.photo = null; m.photoBy = null; })
        .then(ok => { if (ok) { closeSheet(); render(); toast('사진을 지웠어요'); } });
      break;
    case 'reset': if (MODE === 'local') sheetReset(); break;
    case 'wipe': if (MODE === 'local') sheetWipe(); break;
    case 'dowipe': if (MODE !== 'local') break; S = { me: null, meetings: [] }; save(); closeSheet(); go('home'); toast('처음 상태로 비웠어요'); break;
    case 'doreset': if (MODE !== 'local') break; S = seed(); save(); closeSheet(); go('home'); toast('예시 데이터로 되돌렸어요'); break;
  }
});

/* tap to toggle; long-press (touch) or press (mouse) and slide to paint many days */
function paint(k) {
  if (drag.seen.has(k)) return; drag.seen.add(k);
  drag.mode ? draft.add(k) : draft.delete(k); paintEl(k); updCount();
}
$app.addEventListener('pointerdown', e => {
  if (view !== 'input') return;
  const c = e.target.closest('.day[data-d]'); if (!c || c.disabled) return;
  const k = c.dataset.d;
  drag = { x: e.clientX, y: e.clientY, active: false, moved: false, mode: !draft.has(k), seen: new Set(), start: k };
  if (e.pointerType === 'mouse') { drag.active = true; paint(k); e.preventDefault(); }
  else drag.timer = setTimeout(() => { if (drag && !drag.moved) { drag.active = true; paint(drag.start); try { navigator.vibrate && navigator.vibrate(8); } catch (_) {} } }, 300);
});
addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.active) { if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 8) { drag.moved = true; clearTimeout(drag.timer); } return; }
  const el = document.elementFromPoint(e.clientX, e.clientY), c = el && el.closest && el.closest('.day[data-d]');
  if (c && !c.disabled) paint(c.dataset.d);
});
function endDrag(cancel) {
  if (!drag) return; clearTimeout(drag.timer);
  if (!cancel && !drag.active && !drag.moved) { drag.active = true; paint(drag.start); }
  drag = null;
}
addEventListener('pointerup', () => endDrag(false));
addEventListener('pointercancel', () => endDrag(true));
document.addEventListener('touchmove', e => { if (drag && drag.active) e.preventDefault(); }, { passive: false });
$app.addEventListener('contextmenu', e => { if (e.target.closest('.day')) e.preventDefault(); });

render();
boot();
})();
</script>
