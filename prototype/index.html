/* Layout: one phone-width column. Sticky top bar, stacked cards, month calendars, fixed bottom action bar on the input screen.
   Design system: Daangn SEED (values from @seed-design/css 3.1.0). Brand carrot, gray palette, 4px grid,
   radius r1 4 / r2 8 / r3 12 / r4 16 / r6 24, bold action buttons. Token names below are this page's own;
   the comment after each value names the SEED token it comes from. */
:root{
  --bg:#F3F4F5;            /* bg-layer-basement */
  --surface:#FFFFFF;       /* bg-layer-default */
  --floating:#FFFFFF;      /* bg-layer-floating */
  --ink:#1A1C20;           /* fg-neutral */
  --muted:#555D6D;         /* fg-neutral-muted */
  --subtle:#868B94;        /* fg-neutral-subtle */
  --muted-bg:#F3F4F5;      /* bg-neutral-weak */
  --muted-bg-pressed:#EEEFF1; /* bg-neutral-weak-pressed */
  --pressed:rgba(0,0,0,.03);  /* bg-transparent-pressed */
  --line:#EEEFF1;          /* divider (gray-300) */
  --line-muted:rgba(0,0,0,.063); /* stroke-neutral-muted */
  --line-strong:#DCDEE3;   /* stroke-neutral-weak */
  --ring:#5E98FE;          /* stroke-focus-ring */
  --primary:#FF6600; --primary-pressed:#E14D00; --primary-fg:#FFFFFF;   /* bg-brand-solid(+pressed), fg-on-brand-solid */
  --brand-weak:#FFF2EC; --brand-weak-fg:#E14D00;                          /* bg-brand-weak, fg-brand-contrast */
  --destructive:#FA342C; --destructive-weak:#FDF0F0; --destructive-line:#FED4D2; /* critical solid / weak / stroke-weak */
  --success:#079171; --success-bg:#EDFAF6;                                /* positive */
  --accent:#079171; --accent-ink:#FFFFFF; --accent-soft:#EDFAF6;
  --neutral-solid:#555D6D; --neutral-solid-fg:#FFFFFF;                    /* badge neutral solid */
  --inverted:#2A3038; --inverted-fg:#FFFFFF;                              /* bg-neutral-inverted (snackbar) */
  --heat0:#F3F4F5; --heat1:#FFF2EC; --heat2:#FFD5C0; --heat3:#FFB999; --heat4:#FF6600; --heat5:#E14D00; --heat-hi-ink:#FFFFFF; /* carrot 100/300/400/600/700 */
  --holiday:#FA342C; --sat:#217CF9;                                       /* fg-critical, fg-informative */
  --warn-bg:#FFF7DE; --warn-ink:#9B7821; --warn-line:#FBDC65;             /* warning weak */
  --c-pigeon:#6A7FAD; --c-babsae:#A6744A; --c-koala:#7C8592; --c-fox:#DD6C25; --c-dog:#BE9550; --on-member:#FFFFFF;
  --scrim:rgba(0,0,0,.45);                                                /* bg-overlay */
  --stage:#F7F8F9; --ped-top:#FFFFFF; --ped-side:#ECEEF1; --ped-shadow:rgba(26,28,32,.08); --sil-filter:brightness(0) invert(.885); --sil-op:1;
  --shadow-xs:none; --shadow-sm:none;
  --shadow-s1:0 1px 4px rgba(0,0,0,.08); --shadow-s2:0 2px 10px rgba(0,0,0,.1); --shadow-lg:0 4px 16px rgba(0,0,0,.12); /* shadow-s1..s3 */
  --radius:12px; --radius-sm:4px; --radius-md:8px; --radius-xl:16px; --radius-sheet:24px;
  /* SEED font: each device's system font (iPhone SF Pro + Apple SD Gothic Neo, Android Roboto, Windows Segoe UI) */
  --f-display:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard Variable",Pretendard,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol";
  --f-body:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard Variable",Pretendard,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol";
}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance}
.app{max-width:440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.app.has-bar{padding-bottom:120px}

/* focus ring (shadcn: ring-[3px] ring-ring/50) */
.btn:focus-visible,.day:focus-visible,.pick:focus-visible,.rec:focus-visible,.chipbtn:focus-visible,.me-chip:focus-visible,.back:focus-visible,.pickme:focus-visible,.linkbtn:focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 50%,transparent)}

/* header */
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 12px}
.logo{font-family:var(--f-display);font-weight:700;letter-spacing:-.025em;font-size:28px;line-height:1;margin:0;display:flex;align-items:baseline;gap:8px}

.logo small{font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.me-chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-md);padding:0 12px 0 6px;height:36px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;box-shadow:var(--shadow-xs)}
.me-chip:only-child,.me-chip:not(:has(.av)){padding-left:12px}
.me-chip b{color:var(--ink);font-weight:500}

/* avatar (shadcn Avatar) */
.av{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--muted-bg);font-size:19px;line-height:1;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:contain;padding:10%}
.av.sm{width:26px;height:26px;font-size:14px}
.av.lg{width:56px;height:56px;font-size:30px}
.av.off{opacity:.4;filter:grayscale(1)}
.av.off:has(img){filter:none;opacity:1}
.av.off img{filter:var(--sil-filter);opacity:var(--sil-op)}

/* card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xl);padding:20px;box-shadow:var(--shadow-sm)}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--muted)}
/* badge */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:var(--radius-sm);border:1px solid var(--line);padding:2px 8px;font-size:12px;font-weight:500;line-height:1.4;background:var(--surface);color:var(--ink)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--success)}
.pill.st-confirmed{background:var(--success);color:var(--accent-ink);border-color:transparent}
.pill.st-confirmed::before{background:currentColor}
.pill.st-over{background:var(--primary);color:var(--primary-fg);border-color:transparent}
.pill.st-over::before{content:"✓";width:auto;height:auto;border-radius:0;background:none;font-size:11px;line-height:1}
.pill.st-ended{background:var(--muted-bg);color:var(--muted);border-color:transparent}
.pill.st-ended::before{background:var(--muted)}
.h2{font-family:var(--f-display);font-weight:600;letter-spacing:-.02em;font-size:26px;line-height:1.2;margin:10px 0 4px}
.range{color:var(--muted);font-size:12px;margin:0;font-variant-numeric:tabular-nums}

/* members stage */
.members{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:18px 0 16px;padding:20px 10px 16px;border-radius:var(--radius);background:var(--stage)}
.mem{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;text-align:center;min-width:0}
.fig{position:relative;width:100%;aspect-ratio:1/1;display:flex;align-items:flex-end;justify-content:center;margin-bottom:6px}
.fig{--ped-w:84%;--ped-top-h:15%;--ped-depth:5%;--ped-bottom:5%}
/* pedestal: a short cylinder. ::after = body (side band + floor shadow), ::before = top face */
.fig::after{content:"";position:absolute;left:calc((100% - var(--ped-w)) / 2);width:var(--ped-w);bottom:var(--ped-bottom);height:calc(var(--ped-top-h) + var(--ped-depth));
  border-radius:50% / 37.5%; /* = top-h / (top-h + depth) * 50% */
  background:linear-gradient(90deg,color-mix(in srgb,var(--ped-side) 96%,#000) 0%,var(--ped-side) 30%,var(--ped-side) 70%,color-mix(in srgb,var(--ped-side) 96%,#000) 100%);
  box-shadow:0 6px 12px -6px var(--ped-shadow)}
.fig::before{content:"";position:absolute;z-index:1;left:calc((100% - var(--ped-w)) / 2);width:var(--ped-w);bottom:calc(var(--ped-bottom) + var(--ped-depth));height:var(--ped-top-h);border-radius:50%;
  background:var(--ped-top);box-shadow:inset 0 -1px 0 color-mix(in srgb,var(--ped-side) 40%,transparent)}
.char{position:relative;z-index:2;display:block;width:calc(84% * var(--s, 1));margin-bottom:calc(var(--ped-bottom) + var(--ped-depth) + var(--ped-top-h) * .45)}
.char img{display:block;width:100%;height:auto;transition:filter .35s,opacity .35s,transform .35s}
.hat-wrap{position:absolute;left:var(--hx);top:var(--hy);width:36%;z-index:2;transform:translate(-50%,-88%) rotate(-14deg);transform-origin:50% 100%;pointer-events:none}
.hat-wrap.near{opacity:.3}
.hat{display:block;width:100%;height:auto;filter:drop-shadow(0 1px 1px rgba(0,0,0,.15))}
.fig.bday .char{animation:none}
.mem:not(.pending) .fig.bday .hat-wrap{animation:tilt 2.4s ease-in-out .6s infinite}
@keyframes tilt{0%,100%{transform:translate(-50%,-88%) rotate(-14deg)}50%{transform:translate(-50%,-90%) rotate(-6deg)}}
.fig .emo{position:relative;z-index:1;font-size:30px;line-height:1;margin-bottom:14%}

/* results */

.field input{height:44px;border-radius:var(--radius-md);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px;font:inherit;font-size:16px;width:100%;min-width:0;box-shadow:var(--shadow-xs);transition:border-color .15s,box-shadow .15s}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

/* sheet (shadcn Drawer) */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.scrim.open{opacity:1}
.sheet{background:var(--surface);width:100%;max-width:440px;border:1px solid var(--line);border-bottom:0;border-radius:var(--radius-xl) var(--radius-xl) 0 0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transform:translateY(30px);transition:transform .22s ease-out;max-height:86vh;overflow:auto;box-shadow:var(--shadow-lg)}
.scrim.open .sheet{transform:none}
.grab{width:100px;height:6px;border-radius:99px;background:var(--muted-bg);margin:0 auto 16px}
.sheet h2{font-weight:600;letter-spacing:-.01em;font-size:18px;margin:0;line-height:1.35}
.sheet .sub{color:var(--muted);font-size:14px;margin:6px 0 0}
.who-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:20px 0 6px}
.pickme{display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid transparent;background:none;padding:10px 0;border-radius:var(--radius);cursor:pointer;font-size:13px;font-weight:500}
.pickme:hover{background:var(--muted-bg)}
/* 누구세요? 시트: 다연 캐릭터는 70% 크기 */
.pickme[data-v="babsae"] .av img{transform:scale(.7)}
.pickme.on{background:var(--muted-bg);border-color:var(--line)}
.grp{margin-top:16px}
.grp-t{font-size:12px;font-weight:500;color:var(--muted);margin-bottom:8px}
.grp-l{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 2px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500}
.sheet .btns{margin-top:20px}
.row-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}

/* toast (sonner) */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow-lg);padding:12px 16px;border-radius:var(--radius-md);font-size:13px;font-weight:500;opacity:0;transition:opacity .2s,transform .2s;z-index:30;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}


/* ---------- SEED component layer (overrides the base rules above) ---------- */
body{letter-spacing:-.01em}
/* focus: SEED focus ring */
.btn:focus-visible,.day:focus-visible,.pick:focus-visible,.rec:focus-visible,.chipbtn:focus-visible,.me-chip:focus-visible,.back:focus-visible,.pickme:focus-visible,.linkbtn:focus-visible,.photo-empty:focus-visible{outline:2px solid var(--ring);outline-offset:2px;box-shadow:none}

/* surfaces: flat white layers on the gray basement, radius r4 */
.card,.records,.month,.pick,.photo{border:0;box-shadow:none;border-radius:var(--radius-xl)}
.pick:hover{background:var(--surface)}
.pick:active,.rec:active{background:var(--pressed);transform:none}
.rec{border-top-color:var(--line)}
.rec:hover{background:var(--pressed)}
.empty,.photo-empty{border:1px dashed var(--line-strong);border-radius:var(--radius-xl);background:var(--surface)}
.plan{border:1px solid var(--line-strong);box-shadow:none;border-radius:var(--radius)}
.plan-h{background:var(--surface);border-bottom-color:var(--line)}
.members{border-radius:var(--radius)}
.best,.preview{border-radius:var(--radius)}
.preview{background:var(--surface)}

/* action button (large 52 / r3, medium 40 / r2, small 36 / r2), bold label */
.btn{height:52px;border-radius:var(--radius);border:0;box-shadow:none;font-size:16px;font-weight:700;padding:0 20px;transition:background-color .1s}
.btn:active{transform:none}
.btn.pri{background:var(--primary);color:var(--primary-fg);box-shadow:none}
.btn.pri:hover,.btn.pri:active{background:var(--primary-pressed);opacity:1}
.btn.sec{background:var(--muted-bg);color:var(--ink)}
.btn.sec:hover,.btn.sec:active{background:var(--muted-bg-pressed)}
.btn.plain{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-muted)}
.btn.plain:hover,.btn.plain:active{background:var(--pressed)}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:none;border:1px dashed var(--line-strong);font-weight:500}
.btn.ghost:hover{background:var(--pressed)}
.btn.danger{background:transparent;color:var(--muted);font-weight:500}
.btn.del{background:transparent;color:var(--destructive);box-shadow:inset 0 0 0 1px var(--destructive-line)}
.btn.del:hover{background:var(--destructive-weak)}
.btn.del-solid{background:var(--destructive);color:#fff}
.plan-btns .btn,.row-btns .btn{height:40px;border-radius:var(--radius-md);font-size:14px}
.row-btns .btn{height:52px;border-radius:var(--radius);font-size:16px}
.bar{background:color-mix(in srgb,var(--surface) 94%,transparent);border-top-color:var(--line)}

/* chip (outlineStrong, pill) */
.chipbtn{height:32px;padding:0 12px;border:0;border-radius:9999px;background:transparent;box-shadow:inset 0 0 0 1px var(--line-muted);font-size:13px;font-weight:500;color:var(--ink)}
.chipbtn:hover,.chipbtn:active{background:var(--pressed)}
.me-chip{height:36px;border:0;border-radius:9999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-muted);font-weight:500}
.edit-chip{height:28px;font-size:12px}
.dday{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:var(--radius-sm);background:var(--primary);color:var(--primary-fg);font-size:13px;font-weight:700;letter-spacing:.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.dday.today{animation:none;background:var(--destructive)}
.dday-line{display:flex;align-items:center;gap:8px;margin:2px 0 0;font-size:13px;color:var(--subtle)}

.mem[role="button"]{cursor:pointer;border-radius:var(--radius-md);-webkit-tap-highlight-color:transparent}
.mem[role="button"]:active .fig .char{transform:scale(.94);transition:transform .1s}
.mem[role="button"]:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.prof{display:grid;justify-items:center;text-align:center;margin-top:4px}
.prof .fig{width:132px;margin-bottom:8px}
.prof h2{display:flex;align-items:center;gap:6px}
.me-tag{font-size:12px;font-weight:700;padding:2px 6px;border-radius:var(--radius-sm);background:var(--brand-weak);color:var(--brand-weak-fg)}
.prof .sub{margin-top:2px}
.prof-list{margin:20px 0 0;display:grid;border-top:1px solid var(--line)}
.prof-list>div{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line)}
.prof-list dt{font-size:14px;color:var(--subtle)}
.prof-list dd{margin:0;font-size:16px;font-weight:500;display:flex;align-items:center;gap:10px;flex-wrap:wrap;overflow-wrap:anywhere}
.prof-list dd a{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.prof-list .unset{color:var(--subtle);font-weight:400;font-size:15px}
.hint{font-size:12px;color:var(--subtle);margin:0}
.field .hint{justify-self:end}
.hdr-actions{display:flex;align-items:center;gap:8px}
.theme-btn{width:36px;height:36px;flex:none;display:grid;place-items:center;border:0;border-radius:9999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-muted);color:var(--ink);cursor:pointer;padding:0}
.theme-btn svg{width:20px;height:20px}
.theme-btn .moon{color:#555D6D} /* deep gray (SEED gray-800) */
.theme-btn:hover,.theme-btn:active{background:var(--pressed)}
.theme-btn:focus-visible{outline:2px solid var(--ring);outline-offset:2px}

/* badge (r1, bold for solid) */
.pill{border:0;border-radius:var(--radius-sm);padding:3px 6px;font-size:12px;line-height:16px;font-weight:700;gap:0}
.pill::before{display:none!important}
.pill.st-voting{background:var(--brand-weak);color:var(--brand-weak-fg)}
.pill.st-confirmed{background:var(--success);color:#fff}
.pill.st-over{background:var(--neutral-solid);color:var(--neutral-solid-fg)}
.pill.st-ended{background:var(--muted-bg);color:var(--muted);font-weight:500}

/* type: SEED scale t2 12 / t3 13 / t4 14 / t5 16 / t6 18 / t8 22, bold headings */
.eyebrow{font-size:13px;color:var(--muted)}
.range,.status,.help{color:var(--subtle)}
.tb-t{font-size:18px;font-weight:700;letter-spacing:-.02em}
.month-t{font-size:16px;font-weight:700}
.section-t{font-size:14px;font-weight:700;color:var(--ink);margin-top:28px}
.year{font-size:16px;font-weight:700}
.mem .nm{font-weight:700}
.mem .st.ok{color:var(--success);font-weight:700}
.pd{font-weight:700}
.cnt{font-weight:700;color:var(--primary)}
.rank{border-radius:var(--radius-md);font-weight:700}
.pick.first .rank{background:var(--primary);color:var(--primary-fg)}
.pick.all{box-shadow:inset 0 0 0 2px var(--primary)}
.steps li b{font-weight:700}
.steps li::before{border:0;background:var(--brand-weak);color:var(--brand-weak-fg);font-weight:700}
.wk span{color:var(--subtle)}

/* top bar: plain icon button */
.back{width:40px;height:40px;border:0;border-radius:9999px;background:transparent;box-shadow:none;margin-left:-8px}
.back:hover,.back:active{background:var(--pressed)}
.back svg{width:22px;height:22px}

/* text field (outline, large: 52 / r3, 2px contrast ring on focus) */
.field label{font-size:14px;font-weight:700;color:var(--ink)}
.field input,.field select{height:52px;border:0;border-radius:var(--radius);box-shadow:inset 0 0 0 1px var(--line-strong);background-color:var(--surface);padding-inline:16px}
.field select{padding-right:40px;background-position:right 14px center}
.field input::placeholder{color:var(--subtle)}
.field input:focus,.field select:focus{box-shadow:inset 0 0 0 2px var(--ink);border:0}
.warn{border:0;border-radius:var(--radius);background:var(--warn-bg);color:var(--warn-ink)}
.err{color:var(--destructive)}

/* calendar day: brand-solid selection */
.day{border-radius:var(--radius-md);font-size:15px}
.day.sel{background:var(--primary);color:var(--primary-fg);font-weight:700}
.day.sel.hol::after{background:var(--primary-fg)}
.day.conf{outline:2px solid var(--primary);outline-offset:2px}
.legend i{border-radius:var(--radius-sm)}

/* bottom sheet: floating layer, r6 top corners, handle 36x4, title t8 bold, description t5 */
.scrim{background:var(--scrim)}
.sheet{background:var(--floating);border:0;border-radius:var(--radius-sheet) var(--radius-sheet) 0 0;box-shadow:none;padding-top:8px}
.grab{width:36px;height:4px;background:var(--line-strong);margin-bottom:20px}
.sheet h2{font-size:22px;line-height:30px;font-weight:700;letter-spacing:-.02em}
.sheet .sub{font-size:16px;line-height:22px;color:var(--muted);margin-top:8px}
.pickme{border:0;border-radius:var(--radius)}
.pickme.on{background:var(--brand-weak);box-shadow:inset 0 0 0 2px var(--primary)}
.tag{border:0;background:var(--muted-bg);font-weight:500}

/* snackbar */
.toast{background:var(--inverted);color:var(--inverted-fg);border:0;border-radius:var(--radius-md);box-shadow:var(--shadow-s2);font-size:14px;font-weight:500;padding:13px 16px}

/* avatars */
.av{background:var(--muted-bg)}
.rthumb{border-radius:var(--radius)}
.danger-zone{border-top-color:var(--line)}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}
  /* exception: the small 14px character drop still plays (owner's choice) */
  .members.intro .fig .char{animation:drop .34s cubic-bezier(.25,.8,.35,1) both!important;animation-delay:calc(60ms + var(--i, 0) * 70ms)!important}
  .members.intro .fig.bday-on .burst i{animation:pop .9s cubic-bezier(.15,.7,.3,1) both!important;animation-delay:calc(400ms + var(--i, 0) * 70ms + var(--j, 0) * 25ms)!important}
  .prof .fig.bday-on .burst i{animation:pop .9s cubic-bezier(.15,.7,.3,1) both!important;animation-delay:calc(250ms + var(--j, 0) * 25ms)!important}
  .members.intro .mem.cheer .fig .char{animation:drop .34s cubic-bezier(.25,.8,.35,1) both,cheer .26s ease-in-out 2!important;animation-delay:calc(60ms + var(--i, 0) * 70ms),calc(420ms + var(--bi, 0) * 70ms)!important}
  .members.intro .mem.cheer .char::after{animation:clap .9s ease-out both!important;animation-delay:calc(420ms + var(--bi, 0) * 70ms)!important}}
</style>

/* 오늘이 속한 달부터 24개월을 고를 수 있어요. 값은 그 달 1일 */
function monthOpts(sel) {
  const t = new Date(), now = new Date(t.getFullYear(), t.getMonth(), 1), want = toKey(sel);
  const base = sel < now ? new Date(sel.getFullYear(), sel.getMonth(), 1) : now;
  let html = '', found = false;
  for (let i = 0; i < 24; i++) {
    const d = new Date(base.getFullYear(), base.getMonth() + i, 1), k = toKey(d);
    if (k === want) found = true;
    html += `<option value="${k}" ${k === want ? 'selected' : ''}>${d.getFullYear()}년 ${d.getMonth() + 1}월</option>`;
  }
  return found ? html : `<option value="${want}" selected>${sel.getFullYear()}년 ${sel.getMonth() + 1}월</option>` + html;
}
function newInfo() {
  const sm = document.getElementById('nm-start').value, em = document.getElementById('nm-end').value;
  if (!sm || !em) return { err: '후보 기간을 모두 골라주세요.' };
  if (em < sm) return { err: '마지막 달이 시작 달보다 빨라요.' };
  const ed = parse(em), s = sm, e = toKey(new Date(ed.getFullYear(), ed.getMonth() + 1, 0));
  const months = (ed.getFullYear() - parse(sm).getFullYear()) * 12 + ed.getMonth() - parse(sm).getMonth() + 1;
  if (months > 4) return { err: '후보 기간은 4개월 안으로 정해주세요.' };
  const n = days(s, e).length;
  const year = parse(s).getFullYear(), mt = editMid ? byId(editMid) : null;
  const round = mt && mt.year === year ? mt.round : S.meetings.filter(x => x.year === year && x !== mt).length + 1;
  let drop = 0, unconfirm = false;
  if (mt) {
    drop = Object.values(mt.avail || {}).flat().filter(d => d < s || d > e).length;
    unconfirm = !!mt.confirmed && (mt.confirmed < s || mt.confirmed > e);
  }
  return { s, e, n, year, round, drop, unconfirm };
}
function updPrev() {
  const i = newInfo(), p = document.getElementById('nm-prev'), er = document.getElementById('nm-err');
  const w = document.getElementById('nm-warn');
  if (i.err) { er.textContent = i.err; er.hidden = false; w.hidden = true; p.innerHTML = '<span>회차</span><b>-</b>'; return; }
  er.hidden = true;
  const notes = [];
  if (i.unconfirm) notes.push(`확정된 날(${fmt(byId(editMid).confirmed)})이 새 기간 밖이라 확정이 취소돼요.`);
  if (i.drop) notes.push(`새 기간 밖에 찍힌 날짜 ${i.drop}개는 지워져요.`);
  w.innerHTML = notes.join('<br>'); w.hidden = !notes.length;
  p.innerHTML = `<span>${md(i.s)} ~ ${md(i.e)}</span><b>${i.year}년 ${i.round}회차 · ${i.n}일</b>`;
}

    return;
  }
  $app.innerHTML = view === 'home' ? vHome() : view === 'input' ? vInput() : view === 'result' ? vResult() : vNew();

}

function sheetPlan(id) {
  const m = byId(id), log = (m.log || []).slice(-5).reverse();
  const quick = [['12:00', '점심 12시'], ['13:00', '오후 1시'], ['14:00', '오후 2시'], ['15:00', '오후 3시']];
  openSheet(`<h2>시간·장소</h2><p class="sub">${fmtY(m.confirmed)} · 식구 모두가 보고 바꿀 수 있어요.</p>
    <form id="pf" novalidate>
      <div class="field"><label for="pl-time">만나는 시간</label><input id="pl-time" type="time" value="${m.time || ''}">
        <div class="qt">${quick.map(([v, t]) => `<button type="button" class="chipbtn" data-act="settime" data-v="${v}">${t}</button>`).join('')}</div></div>
      <div class="field"><label for="pl-place">만나는 장소</label><input id="pl-place" maxlength="40" placeholder="예: 성수역 3번 출구" value="${esc(m.place || '')}" autocomplete="off"></div>
      <div class="row-btns"><button type="button" class="btn plain" data-act="close">취소</button><button type="submit" class="btn pri">저장하기</button></div>
    </form>
    ${log.length ? `<div class="grp"><div class="grp-t">바뀐 기록</div><ul class="log">${log.map(l => `<li>${av(l.by, 'sm')}<span class="lx">${M[l.by].name} · ${esc(l.text)}</span><span class="lt">${stamp(l.at)}</span></li>`).join('')}</ul></div>` : ''}`);
  document.getElementById('pf').addEventListener('submit', e => { e.preventDefault(); savePlan(id); });
}
function savePlan(id) {
  const m = byId(id), time = document.getElementById('pl-time').value, place = document.getElementById('pl-place').value.trim();
  if (time === (m.time || '') && place === (m.place || '')) { closeSheet(); return; }
  const parts = [];
  if (time !== (m.time || '')) parts.push(time ? `시간 ${fmtTime(time)}` : '시간 지움');
  if (place !== (m.place || '')) parts.push(place ? `장소 ${place}` : '장소 지움');
  const text = parts.join(' · ');
  commit({ type: 'plan', mid: m.id, by: S.me, time, place, text }, () => {
    const n = new Date();
    (m.log || (m.log = [])).push({ by: S.me, at: `${toKey(n)}T${pad(n.getHours())}:${pad(n.getMinutes())}`, text });
    m.time = time; m.place = place;
  }).then(ok => { if (ok) { closeSheet(); render(); toast('시간·장소를 저장했어요'); } });
}
function openPlan(id) { if (!S.me) { pendingAfterPick = 'plan:' + id; sheetWho(); } else sheetPlan(id); }
function sheetLeave() {
  openSheet(`<h2>저장하지 않고 나갈까요?</h2><p class="sub">고른 날짜가 저장되지 않아요.</p>
    <div class="row-btns"><button class="btn plain" data-act="drop">나가기</button><button class="btn pri" data-act="save">저장하기</button></div>`);
}
function sheetWipe() {
  openSheet(`<h2>처음 상태로 비울까요?</h2><p class="sub">모임, 날짜, 기록이 모두 지워지고 사이트를 처음 연 상태가 돼요. 프로토타입이라 이 폰에만 적용돼요.</p>
    <div class="row-btns"><button class="btn plain" data-act="close">취소</button><button class="btn pri" data-act="dowipe">비우기</button></div>`);
}
const CAM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
const MAX_PHOTOS = 10;
/* Photos as a list (older meetings had a single photo/photoBy). */
const photosOf = m => m.photos || (m.photo ? [{ id: 'legacy', url: m.photo, by: m.photoBy || null }] : []);
function photoBlock(m) {
  const ps = photosOf(m);
  if (!ps.length) return `<button class="photo-empty" data-act="photo" data-v="${m.id}">${CAM}<b>모임 사진 올리기</b><span>모임마다 ${MAX_PHOTOS}장까지 남길 수 있어요</span></button>`;
  return `<div class="gallery ${ps.length === 1 ? 'one' : ''}">${ps.map((p, i) => `<figure class="photo"><a href="${p.orig || p.url}" target="_blank" rel="noopener" aria-label="사진 ${i + 1} 원본 보기"><img src="${p.url}" alt="${esc(m.title)} 사진 ${i + 1}" loading="lazy"></a>
      <figcaption><span>${p.by && M[p.by] ? `${ro2(M[p.by].name)} 올렸어요` : ''}${ps.length > 1 ? ` · ${i + 1}/${ps.length}` : ''}</span>
      <span class="photo-btns"><button class="chipbtn" data-act="photodel" data-v="${m.id}" data-p="${p.id}">삭제</button></span></figcaption></figure>`).join('')}</div>
    ${ps.length < MAX_PHOTOS ? `<button class="btn plain photo-add" data-act="photo" data-v="${m.id}">${CAM}사진 추가 <span class="pc">${ps.length}/${MAX_PHOTOS}</span></button>` : ''}`;
}
const ro2 = w => ga(w);
let photoFor = null;
const $photoIn = document.getElementById('photo-in');
function pickPhoto(id) { if (!S.me) { pendingAfterPick = 'photo:' + id; sheetWho(); return; } photoFor = id; $photoIn.value = ''; $photoIn.click(); }
/* Resize on the phone. Display: long side 1920px, JPEG 0.86 (sharp on any phone screen, a few hundred KB).
   Thumbnail: 360px for the past-meetings list. The original file is kept untouched in Vercel Blob. */
async function resized(f, max, q) {
  const url = URL.createObjectURL(f), img = new Image();
  try {
    await new Promise((ok, no) => { img.onload = ok; img.onerror = no; img.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    const g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(img, 0, 0, c.width, c.height);
    return await new Promise((ok, no) => c.toBlob(b => (b ? ok(b) : no(new Error('encode'))), 'image/jpeg', q));
  } finally { URL.revokeObjectURL(url); }
}
const toDataUrl = b => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(b); });
let blobClient = null;
async function uploadToBlob(mid, f) {
  blobClient = blobClient || await import('https://cdn.jsdelivr.net/npm/@vercel/blob@2.8.2/client/+esm');
  const [disp, thumb] = [await resized(f, 1920, 0.86), await resized(f, 360, 0.8)];
  const ext = (f.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 5) || 'jpg';
  const base = `siggu/${mid}`, opts = { access: 'public', handleUploadUrl: '/api/blob-upload' };
  const [o, d, t] = await Promise.all([
    blobClient.upload(`${base}/orig-photo.${ext}`, f, { ...opts, contentType: f.type || undefined, multipart: f.size > 8e6 }),
    blobClient.upload(`${base}/disp-photo.jpg`, disp, { ...opts, contentType: 'image/jpeg' }),
    blobClient.upload(`${base}/thumb-photo.jpg`, thumb, { ...opts, contentType: 'image/jpeg' }),
  ]);
  return { orig: o.url, url: d.url, thumb: t.url };
}
$photoIn.addEventListener('change', async () => {
  const m = byId(photoFor); if (!m) return;
  const room = MAX_PHOTOS - photosOf(m).length;
  const files = [...($photoIn.files || [])].slice(0, Math.max(0, room)); if (!files.length) return;
  if ($photoIn.files.length > room) toast(`사진은 ${MAX_PHOTOS}장까지라 ${room}장만 올릴게요`);
  let done = 0;
  for (const f of files) {
    const n = files.length > 1 ? ` (${done + 1}/${files.length})` : '';
    try {
      if (MODE === 'server') {
        toast(`사진을 올리는 중이에요…${n}`);
        let op;
        if (S.features && S.features.blob) op = { type: 'photo', mid: m.id, by: S.me, ...(await uploadToBlob(m.id, f)) };
        else op = { type: 'photo', mid: m.id, by: S.me, data: await toDataUrl(await resized(f, 1600, 0.85)) };
        if (!(await commit(op))) break;
      } else {
        const data = await toDataUrl(await resized(f, 1600, 0.85));
        const mm = byId(m.id), prev = photosOf(mm);
        mm.photos = [...prev, { id: 'p' + Date.now() + done, url: data, by: S.me }]; delete mm.photo; delete mm.photoBy;
        if (!save()) { mm.photos = prev; toast('저장 공간이 부족해요. 다른 사진을 지운 뒤 다시 올려주세요.'); break; }
      }
    } catch (e) { toast('사진을 올리지 못했어요. 다시 해볼래요?'); break; }
    done++; render();
  }
  if (done) toast(done > 1 ? `사진 ${done}장을 올렸어요` : '모임 사진을 올렸어요');
});
/* ---------- meeting reviews ---------- */
function reviewBlock(m) {
  const cs = m.comments || [];
  const list = cs.length
    ? `<ul class="reviews">${cs.map(c => `<li class="rv">${av(c.by, 'sm')}<div class="rv-b"><div class="rv-h"><b>${M[c.by] ? M[c.by].name : ''}</b><span class="rv-t">${stamp(c.at)}</span>${c.by === S.me ? `<button class="linkbtn rv-del" data-act="cmtdel" data-v="${m.id}" data-p="${c.id}">삭제</button>` : ''}</div><p class="rv-x">${esc(c.text)}</p></div></li>`).join('')}</ul>`
    : `<p class="rv-empty">아직 후기가 없어요. 첫 후기를 남겨보세요.</p>`;
  return `<div class="review-card">${list}
    <form class="rv-form" data-mid="${m.id}" novalidate>${S.me ? av(S.me, 'sm') : ''}<textarea id="rv-in" rows="1" maxlength="300" aria-label="모임 후기" placeholder="${S.me ? '오늘 모임 어땠어요?' : '누구인지 고르고 후기를 남겨요'}"></textarea><button class="btn pri rv-send" type="submit">등록</button></form></div>`;
}
document.addEventListener('submit', async e => {
  const f = e.target.closest && e.target.closest('.rv-form'); if (!f) return;
  e.preventDefault();
  if (!S.me) { pendingAfterPick = null; sheetWho(); return; }
  const ta = f.querySelector('textarea'), text = ta.value.trim(), mid = f.dataset.mid;
  if (!text) { ta.focus(); return; }
  const n = new Date(), at = `${toKey(n)}T${pad(n.getHours())}:${pad(n.getMinutes())}`;
  const ok = await commit({ type: 'comment', mid, by: S.me, text }, () => {
    const m = byId(mid); (m.comments || (m.comments = [])).push({ id: 'c' + Date.now(), by: S.me, text, at });
  });
  if (ok) { render(); toast('후기를 남겼어요'); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'rv-in') { e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 140) + 'px'; }
});
function sheetCmtDel(mid, cid) {
  openSheet(`<h2>이 후기를 지울까요?</h2><p class="sub">지운 후기는 되돌릴 수 없어요.</p>
    <div class="row-btns"><button class="btn plain" data-act="close">취소</button><button class="btn del-solid" data-act="docmtdel" data-v="${mid}" data-p="${cid}">지우기</button></div>`);
}
function sheetPhotoDel(id, pid) {
  openSheet(`<h2>이 사진을 지울까요?</h2><p class="sub">지운 사진은 되돌릴 수 없어요.</p>
    <div class="row-btns"><button class="btn plain" data-act="close">취소</button><button class="btn del-solid" data-act="dophotodel" data-v="${id}" data-p="${pid}">지우기</button></div>`);
}
function sheetReset() {
  openSheet(`<h2>예시 데이터로 되돌릴까요?</h2><p class="sub">이 폰에서 바꾼 내용이 모두 지워져요. 프로토타입이라 다른 사람에겐 영향이 없어요.</p>
    <div class="row-btns"><button class="btn plain" data-act="close">취소</button><button class="btn pri" data-act="doreset">되돌리기</button></div>`);
}

/* ---------- actions ---------- */
function startInput() { const m = cur(); draft = new Set(m.avail[S.me] || []); go('input'); }
function dirty() { const a = cur().avail[S.me] || []; return a.length !== draft.size || a.some(d => !draft.has(d)); }
function updCount() { const c = document.getElementById('count'); if (c) c.innerHTML = `<b>${draft.size}</b>일 선택`; }
function paintEl(k) { const el = $app.querySelector(`.day[data-d="${k}"]`); if (el) { el.classList.toggle('sel', draft.has(k)); el.setAttribute('aria-pressed', draft.has(k)); } }
async function updateMeeting() {
  const i = newInfo(); if (i.err) { updPrev(); return; }
  const id = editMid, typed = document.getElementById('nm-title').value.trim();
  const ok = await commit({ type: 'update', mid: id, title: typed, start: i.s, end: i.e }, () => {
    const m = byId(id), out = !!m.confirmed && (m.confirmed < i.s || m.confirmed > i.e);
    Object.assign(m, { title: typed || m.title, start: i.s, end: i.e, year: i.year, round: i.round });
    for (const k of Object.keys(m.avail || {})) m.avail[k] = m.avail[k].filter(d => d >= i.s && d <= i.e);
    if (out) { m.confirmed = null; m.status = 'voting'; S.meetings.forEach(x => { if (x !== m && x.status === 'voting') x.status = 'archived'; }); }
  });
  if (!ok) return;
  editMid = null; viewMid = id; go('result'); toast('모임을 수정했어요');
}
function sheetDel(id) {
  const m = byId(id);
  openSheet(`<h2>${esc(eul(m.title))} 삭제할까요?</h2><p class="sub">${label(m)} 모임과 식구들이 찍은 날짜, 시간·장소, 사진이 모두 지워져요. 지운 뒤에는 되돌릴 수 없어요.</p>
    <div class="row-btns"><button class="btn plain" data-act="close">취소</button><button class="btn del-solid" data-act="dodel" data-v="${id}">삭제하기</button></div>`);
}
async function createMeeting() {
  const i = newInfo(); if (i.err) { updPrev(); return; }
  const typed = document.getElementById('nm-title').value.trim();
  const ok = await commit({ type: 'create', title: typed, start: i.s, end: i.e }, () => {
    const c = cur(); if (c && c.status === 'voting') c.status = 'archived';
    S.meetings.unshift({ id: 'm' + Date.now(), year: i.year, round: i.round, title: typed || `${i.round}회차 모임`, start: i.s, end: i.e, confirmed: null, status: 'voting', avail: {} });
  });
  if (!ok) return;
  const m = cur();
  go('home'); toast(`${m.year}년 ${m.round}회차 ${eul(m.title)} 만들었어요`);
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) {
    const c = e.target.closest('.day[data-d]');
    if (view === 'input' && c && !c.disabled && e.detail === 0) { draft.has(c.dataset.d) ? draft.delete(c.dataset.d) : draft.add(c.dataset.d); paintEl(c.dataset.d); updCount(); }
    return;
  }
  const v = t.dataset.v;
  switch (t.dataset.act) {
    case 'home': go('home'); break;
    case 'leave': if (dirty()) sheetLeave(); else go('home'); break;
    case 'drop': closeSheet(); go('home'); break;
    case 'who': pendingAfterPick = null; sheetWho(); break;
    case 'enter': if (!S.me) { pendingAfterPick = 'input'; sheetWho(); } else startInput(); break;
    case 'pickme':
      S.me = v; save(); closeSheet(); toast(`${ro(M[v].name)} 들어왔어요`);
      if (pendingAfterPick === 'input') { pendingAfterPick = null; startInput(); }
      else if (pendingAfterPick && pendingAfterPick.startsWith('photo:')) { const id = pendingAfterPick.slice(6); pendingAfterPick = null; render(); pickPhoto(id); }
      else if (pendingAfterPick && pendingAfterPick.startsWith('plan:')) { const id = pendingAfterPick.slice(5); pendingAfterPick = null; render(); sheetPlan(id); }
      else render(); break;
    case 'plan': openPlan(v); break;
    case 'settime': document.getElementById('pl-time').value = v; break;
    case 'result': viewMid = v || cur().id; go('result'); break;
    case 'new': editMid = null; go('new'); break;
    case 'edit': editMid = v; go('new'); break;
    case 'askdel': sheetDel(v); break;
    case 'dodel': {
      const title = (byId(v) || {}).title || '모임';
      commit({ type: 'delete', mid: v }, () => { S.meetings = S.meetings.filter(x => x.id !== v); })
        .then(ok => { if (ok) { closeSheet(); editMid = null; viewMid = null; go('home'); toast(`${eul(title)} 삭제했어요`); } });
      break;
    }
    case 'weekend': { const m = cur(); days(m.start, m.end).filter(isOff).forEach(d => { draft.add(d); paintEl(d); }); updCount(); toast('주말과 공휴일을 모두 골랐어요'); break; }
    case 'clear': { const old = [...draft]; draft.clear(); old.forEach(paintEl); updCount(); break; }
    case 'save': {
      const m = cur(), dates = [...draft].sort();
      commit({ type: 'avail', mid: m.id, member: S.me, dates }, () => { m.avail[S.me] = dates; })
        .then(ok => { if (ok) { closeSheet(); viewMid = m.id; go('result'); toast(`${dates.length}일 저장했어요`); } });
      break;
    }
    case 'retry': MODE = 'loading'; render(); boot(); break;
    case 'day': sheetDay(v); break;
    case 'askconf': sheetConfirm(v); break;
    case 'conf': {
      const id = (byId(viewMid) || cur()).id;
      commit({ type: 'confirm', mid: id, date: v }, () => { const m = byId(id); m.confirmed = v; m.status = 'confirmed'; })
        .then(ok => { if (ok) { render(); toast(`${fmt(v)}로 확정했어요`); openPlan(id); } });
      break;
    }
    case 'unconf': {
      const id = (byId(viewMid) || cur()).id;
      commit({ type: 'unconfirm', mid: id }, () => { const m = byId(id); m.confirmed = null; m.status = 'voting'; S.meetings.forEach(x => { if (x !== m && x.status === 'voting') x.status = 'archived'; }); })
        .then(ok => { if (ok) { closeSheet(); render(); toast('확정을 취소했어요'); } });
      break;
    }
    case 'close': closeSheet(); break;
    case 'cmtdel': sheetCmtDel(v, t.dataset.p); break;
    case 'docmtdel': {
      const cid = t.dataset.p;
      commit({ type: 'commentdel', mid: v, cid, by: S.me }, () => { const m = byId(v); m.comments = (m.comments || []).filter(c => c.id !== cid); })
        .then(ok => { if (ok) { closeSheet(); render(); toast('후기를 지웠어요'); } });
      break;
    }
    case 'profile': sheetProfile(v); break;
    case 'editprofile': if (!S.me) { pendingAfterPick = null; sheetWho(); } else sheetProfileEdit(); break;
    case 'theme': {
      const next = isDark() ? 'light' : 'dark';
      try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
      applyTheme(next); render(); toast(next === 'dark' ? '다크 모드로 바꿨어요' : '라이트 모드로 바꿨어요');
      break;
    }
    case 'photo': pickPhoto(v); break;
    case 'photodel': sheetPhotoDel(v, t.dataset.p); break;
    case 'dophotodel': {
      const pid = t.dataset.p;
      commit({ type: 'photodel', mid: v, pid }, () => { const m = byId(v); m.photos = photosOf(m).filter(p => p.id !== pid); delete m.photo; delete m.photoBy; })
        .then(ok => { if (ok) { closeSheet(); render(); toast('사진을 지웠어요'); } });
      break;
    }
    case 'reset': if (MODE === 'local') sheetReset(); break;
    case 'wipe': if (MODE === 'local') sheetWipe(); break;
    case 'dowipe': if (MODE !== 'local') break; S = { me: null, meetings: [] }; save(); closeSheet(); go('home'); toast('처음 상태로 비웠어요'); break;
    case 'doreset': if (MODE !== 'local') break; S = seed(); save(); closeSheet(); go('home'); toast('예시 데이터로 되돌렸어요'); break;
  }
});

/* tap to toggle; long-press (touch) or press (mouse) and slide to paint many days */
function paint(k) {
  if (drag.seen.has(k)) return; drag.seen.add(k);
  drag.mode ? draft.add(k) : draft.delete(k); paintEl(k); updCount();
}
$app.addEventListener('pointerdown', e => {
  if (view !== 'input') return;
  const c = e.target.closest('.day[data-d]'); if (!c || c.disabled) return;
  const k = c.dataset.d;
  drag = { x: e.clientX, y: e.clientY, active: false, moved: false, mode: !draft.has(k), seen: new Set(), start: k };
  if (e.pointerType === 'mouse') { drag.active = true; paint(k); e.preventDefault(); }
  else drag.timer = setTimeout(() => { if (drag && !drag.moved) { drag.active = true; paint(drag.start); try { navigator.vibrate && navigator.vibrate(8); } catch (_) {} } }, 300);
});
addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.active) { if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 8) { drag.moved = true; clearTimeout(drag.timer); } return; }
  const el = document.elementFromPoint(e.clientX, e.clientY), c = el && el.closest && el.closest('.day[data-d]');
  if (c && !c.disabled) paint(c.dataset.d);
});
function endDrag(cancel) {
  if (!drag) return; clearTimeout(drag.timer);
  if (!cancel && !drag.active && !drag.moved) { drag.active = true; paint(drag.start); }
  drag = null;
}
addEventListener('pointerup', () => endDrag(false));
addEventListener('pointercancel', () => endDrag(true));
document.addEventListener('touchmove', e => { if (drag && drag.active) e.preventDefault(); }, { passive: false });
$app.addEventListener('contextmenu', e => { if (e.target.closest('.day')) e.preventDefault(); });

render();
boot();
})();
</script>
